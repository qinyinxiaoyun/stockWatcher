name: stock-watch

x-app-common: &app-common
  build:
    context: .
    args:
      BUILD_SHA: ${BUILD_SHA:-manual}
  image: stock-watch:${BUILD_SHA:-manual}
  restart: unless-stopped
  env_file:
    - ${STOCK_WATCH_ENV_FILE:-.env}
  environment:
    DATA_DIR: /data
    DATABASE_PATH: /data/stock-watch.db
    BUILD_SHA: ${BUILD_SHA:-manual}
  volumes:
    - ${STOCK_WATCH_DATA_DIR:-./data}:/data
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app-common
    command: ["gunicorn", "stock_watch.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "--timeout", "120", "--worker-tmp-dir", "/tmp", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    <<: *app-common
    command: ["python", "-m", "stock_watch", "worker"]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "stock_watch", "worker-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the Compose interpolation env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: stock-watch-caddy-data
  caddy_config:
    name: stock-watch-caddy-config
