server {
    listen 80;
    listen [::]:80;
    server_name stock.janettepa.uk;
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/platform/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://stock.janettepa.uk$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stock.janettepa.uk;
    ssl_certificate /srv/platform/certs/stock.janettepa.uk/fullchain.pem;
    ssl_certificate_key /srv/platform/certs/stock.janettepa.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    access_log off;
    error_log /dev/null;

    location = /deployment-check {
        default_type text/plain;
        return 200 "stock-watch ingress ok\n";
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
