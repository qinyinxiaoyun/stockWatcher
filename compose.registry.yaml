name: stock-watch

# Production images are built by GitHub Actions; the server only pulls them.
x-runtime: &runtime
  image: ${STOCK_WATCH_IMAGE:?Set an immutable GHCR image digest}
  env_file:
    - ${STOCK_WATCH_ENV_FILE:?Set STOCK_WATCH_ENV_FILE}
  environment:
    DATA_DIR: /data
    DATABASE_PATH: /data/stock-watch.db
    VERIFICATION_DIR: /data/verification
    BUILD_SHA: ${BUILD_SHA:?Set BUILD_SHA}
  volumes:
    - ${STOCK_WATCH_DATA_DIR:?Set STOCK_WATCH_DATA_DIR}:/data
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 192m
  pids_limit: 64
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"

services:
  app:
    <<: *runtime
    ports:
      - "127.0.0.1:8000:8000"
    command: ["gunicorn", "stock_watch.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "2", "--timeout", "120", "--worker-tmp-dir", "/tmp", "--access-logfile", "/dev/null", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    <<: *runtime
    command: ["python", "-m", "stock_watch", "worker"]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "stock_watch", "worker-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
